# yaml-language-server: $schema=../apps/cli/schemas/config.json
# dv dogfooding itself.
#
# This repo is a monorepo:
#   apps/cli      — the dv CLI (Deno)
#   apps/docs     — the VitePress docs site (Node, no published name)
#   packages/*    — shared Deno libs (none yet)
#
# The plugin claims every workspace member with a `name` field in its
# deno.json. apps/docs is intentionally name-less and is silently
# skipped (specs/config-format.md § Matching rules).
#
# We use tools/dv-release/, a repo-local copy of the example Deno plugin
# taken before #44. Since #44 the example also runs a real `deno publish`
# and its other ops have moved on: in-place manifest edits, deno.jsonc,
# workspace deps from the module graph, and skipping `"publish": false`.

# Local path, so dogfooding follows the working tree's schema.
$schema: ../apps/cli/schemas/config.json

discovery:
  plugins:
    - match:
        - "apps/*"
        - "packages/*"
      use:
        run: deno run -A ./tools/dv-release/main.ts

# Long-form companion to CHANGELOG.md — `dv version` writes HISTORY.md
# alongside CHANGELOG.md when enabled. CHANGELOG stays terse (Keep a
# Changelog bullets); HISTORY carries each Record's full body prose
# under per-version h3 subsections. See specs/config-format.md § history.
history:
  enabled: true

# Records you author with `dv add` land in .dv/records/.
